name: ${DO_APP_NAME}
region: ${DO_REGION}
static_sites:
  - name: frontend
    source_dir: /frontend
    github:
      repo: ${SOURCE_REPOSITORY}
      branch: main
      deploy_on_push: false
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        value: ''
        scope: BUILD_TIME
        type: GENERAL
      - key: VITE_PUBLIC_APP_URL
        value: ${APP_URL}
        scope: BUILD_TIME
        type: GENERAL
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: frontend
