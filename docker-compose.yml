services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: escala
      POSTGRES_DB: escala
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env para o banco local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escala -d escala"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
